<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NORANI | 보드게임 플레이 아카이브</title>
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --surface-2: #0b1120;
            --border: #334155;
            --text: #f8fafc;
            --muted: #94a3b8;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --accent: #38bdf8;
            --emerald: #10b981;
            --amber: #f59e0b;
            --rose: #f43f5e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            padding: 28px 16px 60px;
        }
        .container { max-width: 1120px; margin: 0 auto; }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 24px;
        }
        .brand h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
        .brand p { color: var(--muted); font-size: 14px; margin-top: 4px; }
        .header-actions { display: flex; gap: 10px; align-items: center; }
        .domain-pill {
            background: rgba(56, 189, 248, 0.12);
            color: var(--accent);
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
        }
        .btn-add {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-add:hover { background: var(--primary-hover); }

        /* KPI Cards */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            margin-bottom: 24px;
        }
        .kpi {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 18px 20px;
        }
        .kpi-label { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; }
        .kpi-val { font-size: 24px; font-weight: 800; margin-top: 6px; color: var(--text); }
        .kpi-sub { font-size: 12px; color: var(--accent); margin-top: 4px; }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
            overflow-x: auto;
        }
        .tab-btn {
            background: transparent;
            color: var(--muted);
            border: 1px solid transparent;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }
        .tab-btn.active {
            background: var(--surface);
            color: var(--text);
            border-color: var(--border);
        }

        /* Panels */
        .panel { display: none; }
        .panel.active { display: block; }

        /* Rulemaster Grid */
        .rm-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 16px;
        }
        .rm-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
        }
        .rm-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }
        .rm-title { font-size: 16px; font-weight: 700; }
        .rm-total {
            background: rgba(99, 102, 241, 0.2);
            color: #a5b4fc;
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 700;
        }
        .rm-bars { display: flex; flex-direction: column; gap: 8px; }
        .rm-row { display: flex; align-items: center; gap: 10px; font-size: 13px; }
        .rm-name { width: 70px; color: var(--text); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .rm-bar-wrap { flex: 1; background: var(--surface-2); height: 8px; border-radius: 4px; overflow: hidden; }
        .rm-bar { height: 100%; background: var(--primary); border-radius: 4px; }
        .rm-cnt { width: 32px; text-align: right; color: var(--muted); font-weight: 600; }

        /* Filter & Search Bar */
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }
        .group-filters { display: flex; flex-wrap: wrap; gap: 6px; }
        .chip {
            background: var(--surface);
            color: var(--muted);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 13px;
            cursor: pointer;
        }
        .chip.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
            font-weight: 600;
        }
        .search-box {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 14px;
            min-width: 260px;
            outline: none;
        }
        .search-box:focus { border-color: var(--accent); }

        /* Session Cards */
        .session-list { display: flex; flex-direction: column; gap: 12px; }
        .session-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 18px 20px;
            transition: border-color 0.2s;
        }
        .session-card:hover { border-color: #475569; }
        .s-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 10px;
        }
        .s-date { font-size: 15px; font-weight: 700; color: var(--accent); }
        .s-group {
            font-size: 12px;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 6px;
            background: rgba(16, 185, 129, 0.15);
            color: var(--emerald);
        }
        .s-note {
            font-size: 12px;
            color: var(--amber);
            background: rgba(245, 158, 11, 0.12);
            padding: 2px 8px;
            border-radius: 6px;
        }
        .s-row { display: flex; gap: 8px; margin-top: 8px; align-items: flex-start; font-size: 14px; }
        .s-label { color: var(--muted); min-width: 48px; font-weight: 600; font-size: 13px; padding-top: 2px; }
        .tag-list { display: flex; flex-wrap: wrap; gap: 6px; }
        .tag-member {
            background: var(--surface-2);
            border: 1px solid var(--border);
            color: #cbd5e1;
            padding: 2px 9px;
            border-radius: 6px;
            font-size: 13px;
        }
        .tag-game {
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.35);
            color: #c7d2fe;
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
        }

        /* Rank Table */
        .rank-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .rank-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
        }
        .rank-card h3 { font-size: 16px; margin-bottom: 14px; }
        .rank-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(51, 65, 85, 0.5);
            font-size: 14px;
        }
        .rank-item:last-child { border-bottom: none; }
        .rank-num {
            display: inline-block;
            width: 24px;
            font-weight: 800;
            color: var(--accent);
        }
        .rank-badge {
            background: var(--surface-2);
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 12px;
            color: var(--muted);
            font-weight: 700;
        }

        /* Modal */
        .modal-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 50;
        }
        .modal-backdrop.open { display: flex; }
        .modal {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            width: 100%;
            max-width: 560px;
            padding: 24px;
        }
        .modal h2 { font-size: 18px; margin-bottom: 12px; }
        .modal p { font-size: 13px; color: var(--muted); margin-bottom: 14px; }
        .modal select, .modal textarea {
            width: 100%;
            background: var(--surface-2);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 13px;
            margin-bottom: 12px;
            font-family: inherit;
        }
        .modal textarea { height: 150px; resize: vertical; }
        .modal-btns { display: flex; justify-content: flex-end; gap: 8px; }
        .btn-cancel {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--muted);
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .kpi-grid { grid-template-columns: repeat(2, 1fr); }
            .rank-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <div class="brand">
            <h1>🎲 보드게임 모임 & 룰마 아카이브</h1>
            <p>모임별 룰마스터 통계 · 플레이 히스토리 · 게임/멤버 랭킹</p>
        </div>
        <div class="header-actions">
            <span class="domain-pill">norani.duckdns.org</span>
            <button class="btn-add" onclick="openModal()">+ 기록 추가 (붙여넣기)</button>
        </div>
    </header>

    <div class="kpi-grid">
        <div class="kpi">
            <div class="kpi-label">룰마 요약 총합</div>
            <div class="kpi-val" id="kpiRulemaster">160회</div>
            <div class="kpi-sub">8개 모임 그룹 집계</div>
        </div>
        <div class="kpi">
            <div class="kpi-label">상세 기록 세션</div>
            <div class="kpi-val" id="kpiSessions">0회</div>
            <div class="kpi-sub">날짜별 상세 로그</div>
        </div>
        <div class="kpi">
            <div class="kpi-label">누적 플레이 게임</div>
            <div class="kpi-val" id="kpiGames">0종</div>
            <div class="kpi-sub" id="kpiTotalPlays">총 0판 플레이</div>
        </div>
        <div class="kpi">
            <div class="kpi-label">함께한 멤버</div>
            <div class="kpi-val" id="kpiMembers">0명</div>
            <div class="kpi-sub">최다 출석: 시루떡</div>
        </div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('sessions', this)">📅 상세 플레이 기록</button>
        <button class="tab-btn" onclick="switchTab('rulemaster', this)">👑 룰마스터 요약</button>
        <button class="tab-btn" onclick="switchTab('rankings', this)">📊 게임 & 멤버 랭킹</button>
    </div>

    <!-- Tab 1: 상세 플레이 기록 -->
    <div id="panel-sessions" class="panel active">
        <div class="controls">
            <div class="group-filters" id="groupFilters"></div>
            <input type="text" class="search-box" id="searchInput" placeholder="날짜, 멤버, 게임명 검색..." oninput="renderSessions()">
        </div>
        <div class="session-list" id="sessionList"></div>
    </div>

    <!-- Tab 2: 룰마스터 요약 -->
    <div id="panel-rulemaster" class="panel">
        <div class="rm-grid" id="rulemasterGrid"></div>
    </div>

    <!-- Tab 3: 게임 & 멤버 랭킹 -->
    <div id="panel-rankings" class="panel">
        <div class="rank-grid">
            <div class="rank-card">
                <h3>🏆 최다 플레이 게임 TOP 25</h3>
                <div id="gameRankList"></div>
            </div>
            <div class="rank-card">
                <h3>👥 최다 참여 멤버 TOP 25</h3>
                <div id="memberRankList"></div>
            </div>
        </div>
    </div>
</div>

<!-- 기록 추가 모달 -->
<div class="modal-backdrop" id="addModal">
    <div class="modal">
        <h2>새 모임 기록 붙여넣기</h2>
        <p>카톡/노트에 적던 양식(⊙ 날짜 / ▶멤버 / ▶게임) 그대로 붙여넣으면 자동 파싱되어 추가됩니다.</p>

▶게임 - 아크노바, 스플렌더"></textarea>
        <div class="modal-btns">
            <button class="btn-cancel" onclick="closeModal()">취소</button>
            <button class="btn-add" onclick="importText()">파싱 후 저장</button>
        </div>
    </div>
</div>

    function parseArchive(text, defaultGroup = "당근모임(독산)") {
        const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
        const sessions = [];
        let currentGroup = defaultGroup;
        let cur = null;

        for (const line of lines) {
            if (line.startsWith('#')) {
                currentGroup = line.replace(/^#\s*(상세\s*-\s*)?/, '').trim();
            } else if (line.startsWith('⊙')) {
                if (cur) sessions.push(cur);
                cur = {
                    group: currentGroup,
                    date: line.replace(/^⊙\s*/, '').trim(),
                    members: [],
                    games: [],
                    notes: []
                };
            } else if (line.startsWith('▶멤버') && cur) {
                const raw = line.replace(/^▶멤버\s*-\s*/, '');
                cur.members = raw.split('/').map(s => s.trim()).filter(Boolean);
            } else if (line.startsWith('▶게임') && cur) {
                const raw = line.replace(/^▶게임\s*-\s*/, '');
                cur.games = raw.split(',').map(s => s.trim()).filter(Boolean);
            } else if (cur && (line.startsWith('<') || line.startsWith('-'))) {
                cur.notes.push(line.replace(/^[<-]\s*|>$/g, '').trim());
            }
        }
        if (cur) sessions.push(cur);
        return sessions;
    }

    const STORAGE_KEY = 'norani_bg_archive_v1';
    let allSessions = [];
    let selectedGroup = '전체';

    function initData() {
        const base = parseArchive(rawArchiveText);
        const extra = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        allSessions = [...extra, ...base];
        // 최신 날짜순 정렬
        allSessions.sort((a, b) => b.date.localeCompare(a.date));
    }

    function normalizeGameName(name) {
        return name.replace(/\s+/g, '').toLowerCase();
    }

    function normalizeMemberName(name) {
        return name.replace(/\([^)]*\)/g, '').trim();
    }

    function updateKPIs() {
        document.getElementById('kpiSessions').textContent = allSessions.length + '회';

        const gameMap = new Map();
        let totalPlays = 0;
        const memberSet = new Set();

        allSessions.forEach(s => {
            s.games.forEach(g => {
                totalPlays++;
                const key = normalizeGameName(g);
                if (!gameMap.has(key)) gameMap.set(key, g);
            });
            s.members.forEach(m => {
                const clean = normalizeMemberName(m);
                if (clean && !clean.includes('미정') && clean !== '0') memberSet.add(clean);
            });
        });

        document.getElementById('kpiGames').textContent = gameMap.size + '종';
        document.getElementById('kpiTotalPlays').textContent = `총 ${totalPlays}판 플레이`;
        document.getElementById('kpiMembers').textContent = memberSet.size + '명';
    }

    function renderGroupFilters() {
        const groups = ['전체', ...new Set(allSessions.map(s => s.group))];
        const container = document.getElementById('groupFilters');
        container.innerHTML = groups.map(g => {
            const count = g === '전체' ? allSessions.length : allSessions.filter(s => s.group === g).length;
            return `<button class="chip ${selectedGroup === g ? 'active' : ''}" onclick="selectGroup('${g}')">${g} (${count})</button>`;
        }).join('');
    }

    function selectGroup(g) {
        selectedGroup = g;
        renderGroupFilters();
        renderSessions();
    }

    function renderSessions() {
        const q = document.getElementById('searchInput').value.trim().toLowerCase();
        const listEl = document.getElementById('sessionList');

        const filtered = allSessions.filter(s => {
            if (selectedGroup !== '전체' && s.group !== selectedGroup) return false;
            if (!q) return true;
            return s.date.toLowerCase().includes(q) ||
                s.group.toLowerCase().includes(q) ||
                s.members.some(m => m.toLowerCase().includes(q)) ||
                s.games.some(g => g.toLowerCase().includes(q));
        });

        if (filtered.length === 0) {
            listEl.innerHTML = `<div style="text-align:center; padding:40px; color:var(--muted);">검색 결과가 없습니다.</div>`;
            return;
        }

        listEl.innerHTML = filtered.map(s => `
        <div class="session-card">
            <div class="s-top">
                <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
                    <span class="s-date">⊙ ${s.date}</span>
                    <span class="s-group">${s.group}</span>
                    ${s.notes.map(n => `<span class="s-note">${n}</span>`).join('')}
                </div>
            </div>
            <div class="s-row">
                <span class="s-label">멤버</span>
                <div class="tag-list">${s.members.map(m => `<span class="tag-member">${m}</span>`).join('')}</div>
            </div>
            <div class="s-row">
                <span class="s-label">게임</span>
                <div class="tag-list">${s.games.map(g => `<span class="tag-game">${g}</span>`).join('')}</div>
            </div>
        </div>
    `).join('');
    }

    function renderRulemasters() {
        const grid = document.getElementById('rulemasterGrid');
        grid.innerHTML = rulemasterSummary.map(item => `
        <div class="rm-card">
            <div class="rm-head">
                <span class="rm-title">${item.group}</span>
                <span class="rm-total">총 ${item.total}회</span>
            </div>
            <div class="rm-bars">
                ${item.masters.map(([name, cnt]) => {
            const pct = Math.max(6, Math.round((cnt / item.total) * 100));

                            <span class="rm-name">${name}</span>
                            <div class="rm-bar-wrap"><div class="rm-bar" style="width:${pct}%"></div></div>

    function renderRankings() {
        const gameCounts = new Map();
        const gameLabels = new Map();
        const memberCounts = new Map();

        allSessions.forEach(s => {
            s.games.forEach(g => {
                const key = normalizeGameName(g);
                gameCounts.set(key, (gameCounts.get(key) || 0) + 1);
                if (!gameLabels.has(key)) gameLabels.set(key, g);
            });
            s.members.forEach(m => {
                const clean = normalizeMemberName(m);
                if (clean && !clean.includes('미정') && clean !== '0') {
                    memberCounts.set(clean, (memberCounts.get(clean) || 0) + 1);
                }
            });
        });

        const topGames = [...gameCounts.entries()].sort((a, b) => b[1] - a[1]).slice(0, 25);
        document.getElementById('gameRankList').innerHTML = topGames.map(([key, cnt], idx) => `
        <div class="rank-item">
            <div><span class="rank-num">${idx + 1}</span>${gameLabels.get(key)}</div>
            <span class="rank-badge">${cnt}회</span>
        </div>
    `).join('');

        const topMembers = [...memberCounts.entries()].sort((a, b) => b[1] - a[1]).slice(0, 25);
        document.getElementById('memberRankList').innerHTML = topMembers.map(([name, cnt], idx) => `
        <div class="rank-item">
            <div><span class="rank-num">${idx + 1}</span>${name}</div>
            <span class="rank-badge">${cnt}회</span>
        </div>
    `).join('');
    }

    function switchTab(tabName, btn) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('panel-' + tabName).classList.add('active');
    }

    function openModal() { document.getElementById('addModal').classList.add('open'); }
    function closeModal() { document.getElementById('addModal').classList.remove('open'); }

    function importText() {
        const group = document.getElementById('modalGroup').value;
        const text = document.getElementById('modalText').value.trim();
        if (!text) return;

        const parsed = parseArchive(text, group);
        if (parsed.length === 0) {
            alert('⊙ 날짜 형식이 포함된 양식으로 입력해 주세요.');
            return;
        }

        const extra = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        localStorage.setItem(STORAGE_KEY, JSON.stringify([...parsed, ...extra]));

        document.getElementById('modalText').value = '';
        closeModal();
        initData();
        updateKPIs();
        renderGroupFilters();
        renderSessions();
        renderRankings();
    }

    initData();
    updateKPIs();
    renderGroupFilters();
    renderSessions();
    renderRulemasters();
    renderRankings();
</script>
</body>
</html>
